name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Check package contract
        run: python3 -B scripts/release.py check
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -B scripts/release.py check --tag "$RELEASE_TAG"
      - name: Prepare isolated dependency cache
        run: npm install --prefix "$RUNNER_TEMP/toonkit-cache/runtime" --cache "$RUNNER_TEMP/toonkit-cache/npm" --ignore-scripts --no-audit --no-fund three@0.184.0
      - name: Test compiler, both bridges and export guards
        run: python3 -B validation/run.py --cache "$RUNNER_TEMP/toonkit-cache" --work "$RUNNER_TEMP/toonkit-validation" --fetch
      - name: Test packaging and build
        run: |
          python3 -B validation/tests/test_release.py
          python3 -B scripts/release.py build --out "$RUNNER_TEMP/toonkit-release"
      - name: Upload tagged package
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: toonkit-release
          path: ${{ runner.temp }}/toonkit-release/
          if-no-files-found: error
